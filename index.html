<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
const remoteControlUrl = 'https://raw.githubusercontent.com/afram19888-ops/Game.html/802fdd265f573f5d525bc8d1d04e15f7458cb3dc/status.txt';

  fetch(remoteControlUrl)
    .then(response => response.text())
    .then(data => {
      if (data.trim() === '0') {
        document.body.innerHTML = '<div style="height:100vh; display:flex; align-items:center; justify-content:center; background:#000; color:red; font-size:24px; text-align:center;">التطبيق معطل حالياً من قبل المطور.</div>';
      }
    }).catch(err => console.log('تعذر الاتصال'));
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>العب البومب</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/habeba');
  @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@800&display=swap');
  * { -webkit-tap-highlight-color: transparent; outline: none; user-select: none; box-sizing: border-box; }
  
  body { margin: 0; padding: 0; background: radial-gradient(circle at center, #062e03 0%, #041f02 50%, #020f01 100%) !important; font-family: 'Habeba', sans-serif; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background 0.2s; }
  
  .shake-body { background: #5d0000 !important; animation: shake 0.5s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

  .top-frame, .game-frame { margin: 2px; border: none !important; background: transparent !important; }
  .top-bar { height: 100%; background: transparent !important; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; gap: 2px; position: relative; }
  .game-frame { flex: 1; margin: 5px; background: transparent !important; }
  
  .bomb-balls { position: absolute; left: 5px; top: 10px; display: flex; gap: 4px; z-index: 20; }
  .ball { width: 10px; height: 10px; background-color: #ff0000; border-radius: 50%; box-shadow: 0 0 5px red; }
  .sum-box { width: 100%; height: 70px; background: #000; border: 2px solid #fff; color: #fff; text-align: center; font-size: 45px; font-weight: 900; line-height: 65px; border-radius: 4px; margin-bottom: 5px; }
  .main-row { display: flex; align-items: stretch; justify-content: center; gap: 5px; width: 100%; height: 70px; }
  .neon-rect { background: #000; border: 2px solid #00f2ff; box-shadow: 0 0 10px #00f2ff; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; flex: 1; font-size: 16px; font-weight: 900; }
  .title-center { flex: 2; background: #000; border: 2px solid #ff00ff; border-radius: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px #ff00ff; }
  .tufuli-neon { font-family: 'Almarai', sans-serif; color: #ff00ff; font-size: 18px; font-weight: 900; text-align: center; }
  .modal { position: fixed; inset: 0; background: radial-gradient(circle at center, #0a3d08 0%, #031a02 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 10px; }
  .modal-box { background: linear-gradient(145deg, #0d3b0b, #051f04, #020a01); border: 6px solid #000; border-radius: 30px; width: 100%; max-width: 480px; padding: 25px; text-align: center; }
  .modal-title { font-family: 'Almarai', sans-serif; font-size: 28px; color: #00ff00; margin-bottom: 20px; font-weight: 900; }
  .team-input { width: 100%; padding: 12px; border-radius: 10px; border: 3px solid #000; background: #fff; color: #000; font-size: 18px; text-align: center; }
  .opt-row { display: flex; justify-content: space-around; margin: 15px 0; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; border: 2px solid #000; color: #fff; font-weight: 900; }
  select { padding: 8px; border-radius: 8px; background: #000; color: #00ff00; border: 2px solid #00ff00; font-size: 16px; }
  .start-btn { width: 100%; padding: 18px; background: #000; color: #00ff00; font-weight: 900; font-size: 24px; border-radius: 15px; border: 2px solid #00ff00; cursor: pointer; margin-top: 10px; }
  .teams-row { display: flex; gap: 5px; justify-content: center; width: 100%; height: 45%; margin-top: 5px; flex-wrap: wrap; }
  
  .team-box { min-width: 60px; flex: 1; height: 100%; border-radius: 12px; border: 3.5px solid #333; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; transition: 0.3s; }
  .team-box.active { border-color: #00ff00 !important; box-shadow: 0 0 15px #00ff00; transform: scale(1.05); }
  
  .t-name { font-size: 12px; color: #00ff00; font-weight: 900; }
  .t-score-input { width: 90%; background: transparent; border: none; outline: none; color: white; text-align: center; font-size: 28px !important; font-weight: 900; }
  .game-area { height: 100%; width: 100%; display: flex; justify-content: center; align-items: center; padding: 5px; }
  
  /* التعديل لضمان عدم اختفاء الصف الأخير */
  .grid-container { display: grid; gap: 6px; width: 100%; height: 95%; max-width: 450px; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; overflow-y: auto; align-content: start; }
  
  .square { background: radial-gradient(circle at 40% 40%, #2c3e50, #000); border-radius: 8px; border: 1.5px solid #444; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s; display: flex; align-items: center; justify-content: center; }
  .outer-num { color: #a3e635; font-size: 4.2vh; font-weight: 900; z-index: 2; }
  .inner-face { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 4.2vh; font-weight: 900; transform: rotateY(180deg); backface-visibility: hidden; border-radius: 8px; }
  .square.open { transform: rotateY(180deg); }
  .square.open .outer-num { display: none; }
  .square.shatter { animation: shatterAnim 0.8s forwards; pointer-events: none; }
  @keyframes shatterAnim { to { transform: rotateY(180deg) scale(0) rotate(20deg); opacity: 0; } }
  .bg-red { background: #dc2626 !important; } .bg-green { background: #14532d !important; } .bg-blue { background: #1e3a8a !important; } .bg-yellow { background: #a16207 !important; } .bg-purple { background: #581c2d !important; }
</style>
</head>
<body onclick="initAudio(); tryFS();">

<div class="modal" id="settingsModal" style="display:flex;">
  <div class="modal-box">
    <div class="modal-title">العب البومب</div>
    <div class="opt-row"><span>عدد الفرق:</span><select id="teamCountSel" onchange="generateInputs()"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div>
    <div id="teamArea" class="team-inputs-grid"></div>
    <div class="opt-row">
      <select id="gridSizeSel"><option value="50">50 مربع</option><option value="40">40 مربع</option></select>
      <select id="bombCountSel"><option value="2">2 قنبلة</option><option value="3">3 قنابل</option><option value="4">4 قنابل</option></select>
    </div>
    <button onclick="startNewGame()" class="start-btn">ابدأ التحدي</button>
  </div>
</div>

<div class="top-frame">
  <div class="top-bar">
    <div class="bomb-balls" id="bombBallsContainer"></div>
    <div class="sum-box" id="currentSum">0</div>
    <div class="main-row">
      <div class="neon-rect" onclick="openSettings()">إعداد</div>
      <div class="title-center"><div class="tufuli-neon">العب البومب</div></div>
      <div class="neon-rect" onclick="nextTurn()">اسحب</div>
    </div>
    <div class="teams-row" id="teamsList"></div>
  </div>
</div>

<div class="game-frame"><div class="game-area"><div class="grid-container" id="gameGrid"></div></div></div>

<script>
let teams = [], currentTeamIdx = 0, turnPicks = [], isProcessing = false, audioCtx, ballsCount = 0;

function calculateTotal() {
    let finalSum = 0;
    let currentBlock = 0;
    let hasNumber = false;
    turnPicks.forEach((p) => {
        if (p.t === 'n') {
            finalSum += currentBlock; 
            currentBlock = p.v;      
            hasNumber = true;
        } else if (p.t === 'x' && hasNumber) {
            currentBlock *= p.v;      
        }
    });
    return finalSum + currentBlock;
}

function updateSum() { document.getElementById('currentSum').innerText = calculateTotal(); }

function resetTurn() {
    setTimeout(() => {
        document.querySelectorAll('.square.open').forEach(el => { el.classList.add('shatter'); el.classList.remove('open'); });
        turnPicks = []; currentTeamIdx = (currentTeamIdx + 1) % teams.length; updateSum();
        setTimeout(() => { isProcessing = false; renderTeams(); }, 800);
    }, 1000);
}

function startNewGame() {
    const bombCount = parseInt(document.getElementById('bombCountSel').value);
    ballsCount = bombCount;
    const container = document.getElementById('bombBallsContainer');
    container.innerHTML = '';
    for(let i=0; i<bombCount; i++) {
        container.innerHTML += `<div class="ball" id="ball${i+1}"></div>`;
    }

    const count = parseInt(document.getElementById('teamCountSel').value);
    teams = Array.from({length: count}, (_, i) => ({name: document.getElementById(`t${i+1}`).value, score: 0}));
    document.getElementById('settingsModal').style.display = 'none';
    currentTeamIdx = 0; turnPicks = [];
    setupGrid(parseInt(document.getElementById('gridSizeSel').value), bombCount);
    renderTeams(); updateSum();
}

function setupGrid(total, bombs) {
    const grid = document.getElementById('gameGrid'); grid.innerHTML = '';
    let pool = Array(bombs).fill({t:'b', c:'bg-white-special'}).concat(Array(3).fill({t:'x', v:2, c:'bg-white-special'}), Array(2).fill({t:'x', v:3, c:'bg-white-special'}));
    while(pool.length < total) pool.push({t:'n', v:(pool.length % 9)+1, c:['bg-red','bg-green','bg-blue','bg-yellow','bg-purple'][pool.length % 5]});
    pool.sort(() => Math.random() - 0.5).forEach((d, i) => {
        const sq = document.createElement('div'); sq.className = 'square';
        sq.innerHTML = `<span class="outer-num">${i+1}</span><div class="inner-face ${d.c}">${d.t==='b'?'💣':d.t==='x'?'x'+d.v:d.v}</div>`;
        sq.onclick = () => {
            if(isProcessing || sq.classList.contains('open')) return;
            sq.classList.add('open');
            
            // 1. حالة القنبلة (مع تأثير بصري واهتزاز)
            if(d.t === 'b') { 
                isProcessing = true;
                document.body.classList.add('shake-body');
                setTimeout(() => document.body.classList.remove('shake-body'), 500);
                if(ballsCount > 0) { 
                    document.getElementById('ball'+ballsCount).style.display = 'none'; 
                    ballsCount--; 
                } 
                teams[currentTeamIdx].score = 0;
                resetTurn(); 
            } 
            // 2. حالة التشابه (إنهاء الدور بدون تأثير بصري)
            else if (d.t === 'n' && turnPicks.some(p => p.t === 'n' && (p.v === d.v || p.c === d.c))) {
                isProcessing = true;
                // لا يوجد كود اهتزاز هنا
                resetTurn(); 
            }
            else { turnPicks.push(d); updateSum(); }
        };
        grid.appendChild(sq);
    });
}

function renderTeams() { 
    document.getElementById('teamsList').innerHTML = teams.map((t, i) => `
        <div class="team-box ${i === currentTeamIdx ? 'active' : ''}">
            <div class="t-name">${t.name}</div>
            <input type="number" class="t-score-input" value="${t.score}" onchange="teams[${i}].score = parseInt(this.value)">
        </div>`).join(''); 
}

function nextTurn() { if (isProcessing || turnPicks.length === 0) return; isProcessing = true; teams[currentTeamIdx].score += calculateTotal(); resetTurn(); }
function generateInputs() { const c = document.getElementById('teamCountSel').value; document.getElementById('teamArea').innerHTML = Array.from({length: c}, (_, i) => `<input class="team-input" id="t${i+1}" value="فريق ${i+1}">`).join(''); }
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function tryFS() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); }
function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
generateInputs();
</script>
</body>
</html>
